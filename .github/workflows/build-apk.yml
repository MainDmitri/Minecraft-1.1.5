name: Build APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mcpe-client-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Прямая ссылка без входа в GitHub: релиз «latest» с последним APK.
      - name: Publish APK to release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mcpe-client.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --target "$GITHUB_SHA" --title "MCPE 1.1.5 Client" --notes "Последняя сборка APK."
          gh release upload latest mcpe-client.apk --clobber
          gh release edit latest --notes "Последняя сборка APK. Коммит: $GITHUB_SHA"
